# Fiberstyring (mappen udrulning): gratis Supabase-projekter pauses efter en uge uden aktivitet.
# Denne opgave laver et lille opslag hver tredje dag, så projektet forbliver aktivt.
name: Fiberstyring – hold Supabase vågen
on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS -o /dev/null -w "Supabase svarede %{http_code}\n"
          -H "apikey: sb_publishable_uTH5yS668nP9wDvhTczjfw_8g9wDOPS"
          "https://ahmhvhuqaqximjhsgvec.supabase.co/rest/v1/fiber_log?select=id&limit=1"
